<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Panel DJ - ONIX</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/styles.css">
</head>

<body class="dj dj-pro">
  <div class="container">

    <header class="topbar dj-pro-topbar">
      <div class="dj-title-status">
        <div class="dj-brand-block">
          <div class="title">Panel DJ</div>
        </div>
      </div>

      <div class="top-actions">
        <span class="badge dj-count-badge" id="countBadge">0 pendientes</span>

        <button class="btn btn-small dj-action" id="refreshBtn" type="button">
          Actualizar
        </button>

        <button class="btn btn-small btn-danger dj-action" id="clearAllBtn" type="button">
          Limpiar
        </button>

        <button class="btn btn-small dj-action" id="logoutBtn" type="button">
          Salir
        </button>
      </div>
    </header>

    <main class="grid dj-pro-grid">

      <section class="requests-area dj-pro-section">
        <div class="section-head">
          <div>
            <div class="section-kicker">SOLICITUDES</div>
          </div>
        </div>

        <div class="cards" id="cards"></div>

        <div class="toast" id="emptyMsg" style="margin-top:12px;"></div>
      </section>

      <aside class="panel dj-fresh-panel">
        <div class="section-head compact">
          <div>
            <div class="section-kicker">MOSTRANDO EN PANTALLA</div>
          </div>
        </div>

        <div id="lastTables" class="dj-fresh-list"></div>
      </aside>

    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/dj.js"></script>
</body>
</html>
