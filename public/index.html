<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pedir Canción</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="container">
    <div class="topbar">


  <div>
    <div class="title">Pide tu Canción</div>
    <div class="muted">
      Completa los datos y envía tu solicitud al DJ.
    </div>
  </div>

  <span class="badge logo-badge">
    <img src="/img/logo-qr.png" alt="Zona Zero">
  </span>

</div>

<form class="form" id="requestForm" autocomplete="off">

  <div>
    <label for="table">Número de mesa</label>
    <input
      id="table"
      name="table"
      inputmode="numeric"
      placeholder="Ej: 12"
      maxlength="2"
      required
    />
  </div>

  <div>
    <label for="name">Tu Nombre</label>
    <input
      id="name"
      name="name"
      placeholder="Ej: Esteban"
      maxlength="40"
      required
    />
  </div>

  <div>
    <label for="artist">Artista / Cantante</label>
    <input
      id="artist"
      name="artist"
      placeholder="Ej: Alejandro Fernández"
      maxlength="40"
      required
    />
  </div>

  <div>
    <label for="song">Canción / Tema</label>
    <input
      id="song"
      name="song"
      placeholder="Ej: Mátalas"
      maxlength="40"
      required
    />
  </div>

  <div class="photo-upload-block">
    <label for="photo">Sube tu foto de perfil <span class="optional-text">(opcional)</span></label>
    <input
      id="photo"
      name="photo"
      type="file"
      accept="image/jpeg,image/png,image/webp"
    />
    <div class="photo-help">
      Si subes una foto, aparecerá en el disco mientras estés cantando. Máximo 5 MB.
    </div>
    <div id="photoPreviewWrap" class="photo-preview-wrap" hidden>
      <img id="photoPreview" class="photo-preview" alt="Vista previa de la foto">
      <button id="removePhotoBtn" class="photo-remove-btn" type="button">Quitar foto</button>
    </div>
  </div>

  <button class="btn" type="submit">
    Enviar solicitud
  </button>

  <div class="contact-link-wrap">
    <a
      href="https://api.whatsapp.com/send/?phone=56951855004&text=Hola+quiero+cotizar+un+karaoke&type=phone_number&app_absent=0"
      target="_blank"
      class="contact-link"
    >
      ¿Necesitas Karaoke App?
    </a>
  </div>

  <div class="toast" id="toast"></div>

</form>

<div class="toast muted" style="margin-top:14px;"></div>

  </div>

  <script src="/user.js"></script>

</body>
</html>
